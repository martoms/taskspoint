<a class="skip-link" href="#main-content">Skip to main content</a>

<header class="site-header">
  <div class="header-inner">
    <a class="brand" routerLink="/tasks" aria-label="Taskflow home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none">
          <path d="M7 16.5 13 22l12-13" />
          <path d="M26 17v8a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h11" />
        </svg>
      </span>
      <span>Taskflow</span>
    </a>

    <nav class="primary-nav" aria-label="Main navigation">
      <a
        routerLink="/tasks"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        Tasks
      </a>
      <a class="button button-primary nav-create" routerLink="/tasks/new">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M10 4v12M4 10h12" />
        </svg>
        <span>New task</span>
      </a>
    </nav>
  </div>
</header>

<router-outlet />
